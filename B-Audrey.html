<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Audrey</title>
  <link rel="stylesheet" href="B-Audrey.css">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- LOGIN OVERLAY -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <h2>Connexion Requise</h2>
      <p>Accès restreint à l'administration</p>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Adresse e-mail</label>
          <input type="email" id="login-email" required>
        </div>
        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" required>
        </div>
        <p id="login-error" class="login-error"></p>
        <button type="submit" class="btn" style="width: 100%;">Se connecter</button>
      </form>
    </div>
  </div>

  <div class="dashboard-container">
    <h1>Espace Administration</h1>
    <p class="subtitle">Gestion du Portfolio - Glow Beauty</p>

    <div class="panel">
      <h2>Ajouter une nouvelle photo / vidéo</h2>
      <form id="upload-form">
        <div class="form-group">
          <label for="file">Fichier (Image ou Vidéo)</label>
          <input type="file" id="file" accept="image/*,video/mp4,video/quicktime" required>
        </div>
        
        <div class="form-group">
          <label for="category">Catégorie</label>
          <select id="category" required>
            <option value="nude">Nude & Naturel</option>
            <option value="glamour">Glamour</option>
            <option value="smokey">Smokey</option>
          </select>
        </div>

        <div class="form-group">
          <label for="title">Titre du look</label>
          <input type="text" id="title" placeholder="Ex: Soft Morning Glow" required>
        </div>

        <div class="form-group">
          <label for="desc">Description courte</label>
          <input type="text" id="desc" placeholder="Ex: Natural Skin Finish" required>
        </div>

        <button type="submit" class="btn" id="submit-btn">Uploader et Ajouter</button>
        
        <div class="progress-container" id="progress-container">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <small id="progress-text">0%</small>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Portfolio Actuel</h2>
      <div class="grid" id="portfolio-grid">
        <!-- Rempli par le JS -->
      </div>
    </div>
  </div>

  <script type="module" src="B-Audrey.js"></script>
</body>
</html>
